<!DOCTYPE html><html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>翁法洛斯 · 永恒之地</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#D4AF37;--gold-light:#F0D060;--gold-dark:#A68A2B;--bg-deep:#0a0a12;--bg-card:#12121e;--text-primary:#e8e0d0;--text-secondary:#a09880;--font-display:'Palatino Linotype','Book Antiqua',Palatino,serif;--font-body:Georgia,'Times New Roman',serif;--t:.5s cubic-bezier(.25,.46,.45,.94)}
html{scroll-snap-type:y mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
body{font-family:var(--font-body);background:var(--bg-deep);color:var(--text-primary);overflow-x:hidden;line-height:1.7}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg-deep)}::-webkit-scrollbar-thumb{background:var(--gold-dark);border-radius:3px}

/* Loader */
#loader{position:fixed;inset:0;z-index:9999;background:var(--bg-deep);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1s}
#loader.hidden{opacity:0;pointer-events:none}
.loader-ring{width:80px;height:80px;border:3px solid transparent;border-top-color:var(--gold);border-radius:50%;animation:spin 1.2s linear infinite;position:relative}
.loader-ring::before{content:'';position:absolute;width:60px;height:60px;border:3px solid transparent;border-bottom-color:var(--gold-light);border-radius:50%;top:7px;left:7px;animation:spin .8s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{margin-top:20px;font-family:var(--font-display);font-size:14px;letter-spacing:6px;color:var(--gold);opacity:.7}

nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:14px 28px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(10,10,18,.95),transparent);pointer-events:none}
.nav-logo{font-family:var(--font-display);font-size:16px;color:var(--gold);letter-spacing:4px;pointer-events:auto}
.nav-logo span{font-size:11px;color:var(--text-secondary);letter-spacing:2px;margin-left:6px}
.progress-bar{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-light));z-index:1001;transition:width .3s}

.mt{position:fixed;bottom:24px;right:24px;z-index:1000;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--gold-dark);background:rgba(10,10,18,.85);backdrop-filter:blur(8px);color:var(--gold);font-size:18px;cursor:pointer;transition:var(--t);display:flex;align-items:center;justify-content:center}
.mt:hover{border-color:var(--gold);background:rgba(212,175,55,.1)}
#bgm,#char{display:none}
.mi{position:fixed;bottom:24px;right:78px;z-index:1000;font-size:11px;color:var(--text-secondary);opacity:.6;letter-spacing:1px;pointer-events:none}

/* Sections */
.sec{scroll-snap-align:start;min-height:100vh;height:100vh;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 24px 40px;overflow:hidden}
.st{font-family:var(--font-display);font-size:clamp(24px,4.5vw,42px);color:var(--gold);letter-spacing:5px;margin-bottom:24px;text-align:center;z-index:2}
.rv{opacity:0;transform:translateY(24px);transition:opacity .8s,transform .8s}
.rv.v{opacity:1;transform:translateY(0)}

/* HERO */
#h{background:radial-gradient(ellipse at center,#1a1528 0%,var(--bg-deep) 70%);justify-content:center;text-align:center}
#h::after{content:'';position:absolute;inset:0;background:url('images/amphoreus.jpg')center/cover no-repeat;opacity:.12;pointer-events:none}
#pc{position:absolute;inset:0;pointer-events:none}
.ht{font-family:var(--font-display);font-size:clamp(32px,7vw,72px);font-weight:900;color:var(--gold);text-shadow:0 0 30px rgba(212,175,55,.3);letter-spacing:8px;opacity:0;transform:translateY(30px);animation:fi 2s ease forwards 1s;position:relative;z-index:2}
.hs{font-size:clamp(16px,2.5vw,24px);color:var(--text-secondary);margin-top:12px;letter-spacing:5px;opacity:0;animation:fi 2s ease forwards 1.8s;position:relative;z-index:2}
.hd{max-width:600px;margin-top:24px;font-size:17px;line-height:1.8;color:rgba(232,224,208,.7);opacity:0;animation:fi 2s ease forwards 2.4s;position:relative;z-index:2}
.hq{margin-top:36px;font-style:italic;font-size:18px;color:var(--gold);opacity:0;animation:fi 2s ease forwards 2.8s;border-left:2px solid var(--gold-dark);padding-left:20px;position:relative;z-index:2}
@keyframes fi{to{opacity:1;transform:translateY(0)}}
.sh{position:absolute;bottom:28px;animation:bo 2s infinite;color:var(--text-secondary);font-size:13px;letter-spacing:3px;opacity:.5;z-index:2}
@keyframes bo{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ===== HORIZONTAL S-CURVE RIVER ===== */
#river{background:linear-gradient(180deg,var(--bg-deep),#0c0c1a);position:relative}
#river::before{content:'';position:absolute;inset:0;background:url('images/时代之河背景图.jpg')center/cover no-repeat;opacity:.5;pointer-events:none}
.river-s-wrap{position:relative;width:100%;max-width:960px;height:calc(100vh - 140px);margin:0 auto;display:flex;flex-direction:column;justify-content:center}
.river-s-svg{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);width:100%;height:60%;pointer-events:none}
.river-s-node{position:absolute;z-index:3;display:flex;flex-direction:column;align-items:center;transform:translateX(-50%)}
.river-s-dot{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--gold);background:var(--bg-deep);box-shadow:0 0 12px rgba(212,175,55,.3);z-index:4;position:relative}
.river-s-dot::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:1px solid rgba(212,175,55,.25);animation:dp 3s ease infinite}
@keyframes dp{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.12)}}
.river-s-card{position:absolute;background:var(--bg-card);border:1px solid rgba(212,175,55,.18);border-radius:12px;padding:14px 18px;width:220px;transition:var(--t);text-align:center}
.river-s-card .rc-icon{font-size:28px;margin-bottom:4px}
.river-s-card .rc-name{font-family:var(--font-display);font-size:18px;color:var(--gold);letter-spacing:3px}
.river-s-card .rc-tag{display:inline-block;padding:2px 12px;border:1px solid var(--gold-dark);border-radius:10px;font-size:11px;color:var(--text-secondary);margin-top:4px;letter-spacing:2px}
.river-s-card .rc-div{height:1px;background:linear-gradient(90deg,transparent,var(--gold-dark),transparent);margin:8px 0}
.river-s-card .rc-desc{color:rgba(232,224,208,.8);font-size:13px;line-height:1.6;text-align:left}
.river-s-node[data-side="up"] .river-s-card{bottom:calc(100% + 10px)}
.river-s-node[data-side="down"] .river-s-card{top:calc(100% + 10px)}

/* ===== REGIONS - hero style fullscreen ===== */
#reg{padding:0;position:relative;overflow:hidden;background:var(--bg-deep)}
.reg-bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity 1.2s ease;opacity:0}
.reg-bg.active{opacity:1}
.reg-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,10,18,0) 0%,rgba(10,10,18,0) 30%,rgba(10,10,18,.9) 100%)}
.reg-overlay{position:absolute;bottom:0;left:0;right:0;z-index:3;padding:60px 48px 40px;background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.6) 50%,rgba(0,0,0,.95) 100%)}
.reg-overlay .rn2{font-family:var(--font-display);font-size:32px;color:var(--gold);letter-spacing:5px;text-shadow:0 0 20px rgba(212,175,55,.2)}
.reg-overlay .rt2{font-size:17px;color:var(--text-secondary);margin-top:4px;letter-spacing:3px}
.reg-overlay .rdv{height:1px;background:linear-gradient(90deg,var(--gold-dark),transparent);margin:12px 0;width:50%}
.reg-overlay .rdd2{font-size:15px;color:rgba(232,224,208,.85);line-height:1.8;max-width:600px}
.reg-overlay .rm{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.reg-overlay .rm span{padding:2px 14px;border:1px solid rgba(212,175,55,.15);border-radius:10px;font-size:12px;color:var(--text-secondary)}
.reg-dots{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:5;display:flex;gap:10px}
.reg-dot{width:12px;height:12px;border-radius:50%;border:2px solid rgba(212,175,55,.4);background:transparent;cursor:pointer;transition:var(--t);position:relative}
.reg-dot.active{border-color:var(--gold);background:var(--gold);box-shadow:0 0 10px rgba(212,175,55,.4)}
.reg-dot:hover{border-color:var(--gold)}
.reg-dot .dot-label{position:absolute;top:-24px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;color:var(--gold);letter-spacing:2px;opacity:0;transition:opacity .3s;pointer-events:none;font-family:var(--font-display)}
.reg-dot:hover .dot-label{opacity:1}
@media(max-width:768px){.reg-overlay{padding:40px 24px 24px}.reg-overlay .rn2{font-size:24px}.reg-overlay .rdd2{font-size:13px}}

/* ===== TITANS UPPER SEMICIRCLE - full viewport ===== */
#tt{background:radial-gradient(ellipse at 50% 25%,rgba(26,21,40,.6) 0%,var(--bg-deep) 70%);padding-top:4px;padding-bottom:16px;position:relative}
#tt::before{content:'';position:absolute;inset:0;background:url('images/泰坦神座.jpg')center/cover no-repeat;opacity:.25;pointer-events:none}
.tt-wrap{position:relative;width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}
.tt-arch{position:relative;width:100%;flex:1;min-height:0;margin:0 auto}
.tt-item{position:absolute;display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:all .6s cubic-bezier(.34,1.56,.64,1);z-index:3}
.tt-item img{object-fit:contain;filter:drop-shadow(0 0 6px rgba(212,175,55,.2));transition:var(--t)}
.tt-item:hover img{filter:drop-shadow(0 0 14px rgba(212,175,55,.5));transform:scale(1.12)}
.tt-item .tl{font-size:11px;color:var(--text-primary);margin-top:3px;text-align:center;letter-spacing:1px;pointer-events:none}
.tt-item .ts2{font-size:9px;color:var(--text-secondary);text-align:center;pointer-events:none}
.tt-gl{display:flex;justify-content:space-around;width:100%;max-width:750px;margin-top:4px;padding:0 15px;flex-shrink:0}
.tt-gl span{font-family:var(--font-display);font-size:10px;color:var(--gold-dark);letter-spacing:3px;opacity:.5}

/* Titan zoom - magnifier effect on whole view */
.tt-wrap{position:relative;width:100%;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;overflow:hidden}
.tt-arch{position:relative;width:100%;flex:1;min-height:0;margin:0 auto;transition:transform .6s cubic-bezier(.25,.46,.45,.94)}
.tt-wrap.zoomed .tt-arch{transform:scale(2.5)}
.tt-wrap.zoomed .tt-gl{opacity:0;transition:opacity .3s}
.tt-wrap.zoomed .tt-arch .tt-item:not(.active){opacity:.05;transition:opacity .3s}
.tt-wrap.zoomed .tt-arch .tt-item.active{opacity:1;z-index:4}
.tt-wrap.zoomed .tt-arch .tt-item.active .tl,.tt-wrap.zoomed .tt-arch .tt-item.active .ts2{font-size:1.2em!important}
.tt-focus-tip{position:fixed;right:0;top:0;bottom:0;width:28%;background:linear-gradient(270deg,rgba(18,18,30,.95) 70%,transparent);z-index:100;display:flex;flex-direction:column;justify-content:center;padding:56px 36px 56px 52px;transform:translateX(100%);opacity:0;transition:all .6s cubic-bezier(.25,.46,.45,.94);pointer-events:none}
.tt-focus-tip.open{transform:translateX(0);opacity:1;pointer-events:auto}
.tft-close{position:fixed;top:20px;right:calc(28% + 8px);background:none;border:none;color:var(--text-secondary);font-size:28px;cursor:pointer;transition:var(--t);z-index:101;opacity:0;pointer-events:none}
.tft-close.open{opacity:1;pointer-events:auto}
.tft-close:hover{color:var(--gold)}
.tf-name{font-family:var(--font-display);font-size:28px;color:var(--gold);letter-spacing:4px}
.tf-title{font-size:18px;color:var(--text-secondary);margin-top:4px;letter-spacing:2px}
.tf-div{height:1px;background:linear-gradient(90deg,var(--gold-dark),transparent);margin:14px 0}
.tf-row{margin-bottom:8px}
.tf-row .l{color:var(--gold);font-size:14px;letter-spacing:2px;display:block}
.tf-row .v{color:rgba(232,224,208,.9);font-size:16px;line-height:1.7}
@media(max-width:768px){.tt-wrap.zoomed .tt-arch{transform:scale(2.5)}.tt-focus-tip{width:100%;background:rgba(18,18,30,.97)}.tft-close{right:16px}}

/* ===== BOOK ===== */
#bk{background:linear-gradient(180deg,var(--bg-deep),#0d0d18)}
#bk::before{content:'';position:absolute;inset:0;background:url('images/黄金裔群像背景图.jpg')center/cover no-repeat;opacity:.5;pointer-events:none}
.bc{display:flex;gap:0;max-width:1120px;width:100%;height:62vh;min-height:420px;background:rgba(18,18,30,.4);border:1px solid rgba(212,175,55,.2);border-radius:12px;overflow:hidden}
.bs{width:190px;min-width:190px;background:rgba(10,10,18,.3);border-right:1px solid rgba(212,175,55,.15);overflow-y:auto}
.bs::-webkit-scrollbar{width:3px}
.bst{font-family:var(--font-display);font-size:12px;color:var(--gold-dark);letter-spacing:4px;padding:10px 14px;text-align:center;border-bottom:1px solid rgba(212,175,55,.1)}
.ci{display:flex;align-items:center;gap:8px;padding:6px 14px;cursor:pointer;transition:var(--t);border-left:3px solid transparent}
.ci:hover{background:rgba(212,175,55,.05)}
.ci.active{background:rgba(212,175,55,.08);border-left-color:var(--gold)}
.ca{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--gold-dark);overflow:hidden;flex-shrink:0;background:var(--bg-deep)}
.ca img{width:100%;height:100%;object-fit:cover}
.cn{font-size:13px;color:var(--text-primary)}
.bcont{flex:1;padding:24px 28px;overflow-y:auto;position:relative;display:flex;gap:20px}
.bci{max-width:480px;margin:0 auto 0 0;flex-shrink:0}
.bci-right{flex:0 0 260px;width:260px;display:flex;align-items:center;justify-content:center;position:relative}
.bci-right .char-full-wrap{width:248px;height:calc(62vh - 100px);min-height:360px;max-height:520px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:4px}
.bci-right .char-full{width:100%;height:100%;object-fit:cover;object-position:center;border-radius:4px;filter:drop-shadow(0 0 20px rgba(212,175,55,.15));transition:var(--t)}
.cdn{font-family:var(--font-display);font-size:clamp(18px,2.5vw,24px);color:var(--gold);letter-spacing:3px;display:block;margin-bottom:2px}
.cdti{font-size:15px;color:var(--text-secondary);margin-top:2px;letter-spacing:2px}
.cdd{height:1px;background:linear-gradient(90deg,var(--gold-dark),transparent);margin:10px 0}
.cds{margin-bottom:10px}
.cds h4{font-family:var(--font-display);font-size:11px;color:var(--gold);letter-spacing:3px;margin-bottom:3px}
.cds p{font-size:14px;color:rgba(232,224,208,.8);line-height:1.8}
.cdq{font-style:italic;color:var(--gold);border-left:2px solid var(--gold-dark);padding-left:12px;margin:10px 0;font-size:14px}
.cds2{text-align:right;font-size:10px;color:rgba(160,152,128,.4);letter-spacing:2px;margin-top:6px}
@media(max-width:768px){.bc{flex-direction:column;height:auto}.bs{width:100%;min-width:unset;max-height:150px;border-right:none;border-bottom:1px solid rgba(212,175,55,.15)}.bcont{padding:16px;flex-direction:column}.bci{max-width:100%}.bci-right{flex:0 0 auto;width:100%}.bci-right .char-full-wrap{width:100%;height:auto;min-height:auto;max-height:50vh}.bci-right .char-full{width:auto;height:auto;max-height:50vh;max-width:100%}}

/* FINAL */
#fn{background:radial-gradient(ellipse at center,#1a1528 0%,var(--bg-deep) 70%);text-align:center;position:relative}
#fn::after{content:'';position:absolute;inset:0;background:url('images/最后一页背景图.png')center/cover no-repeat;opacity:.3;pointer-events:none}
.fs{max-width:660px;position:relative;z-index:2}
.fq{font-size:clamp(22px,3.5vw,32px);font-family:var(--font-display);color:var(--gold);letter-spacing:4px;line-height:1.5}
.ft{font-size:17px;color:rgba(232,224,208,.7);margin-top:24px;line-height:2}
.fsi{margin-top:32px;font-size:13px;color:var(--text-secondary);letter-spacing:5px}
.fb{display:inline-block;margin-top:20px;padding:10px 32px;border:1px solid var(--gold);color:var(--gold);font-family:var(--font-display);font-size:13px;letter-spacing:4px;background:transparent;cursor:pointer;transition:var(--t)}
.fb:hover{background:rgba(212,175,55,.1);box-shadow:0 0 20px rgba(212,175,55,.2)}
</style>
</head>
<body>
<div id="loader"><div class="loader-ring"></div><div class="loader-text">翁法罗斯</div></div>
<nav><div class="nav-logo">翁法罗斯 <span>· 永恒之地</span></div></nav>
<div class="progress-bar" id="pb"></div>
<button class="mt" id="mtb">♫</button><div class="mi" id="mi2"></div>
<audio id="bgm" loop></audio><audio id="char"></audio>

<section class="sec" id="h"><canvas id="pc"></canvas><div class="ht">翁法罗斯</div><div class="hs">AMPHOREUS · 永恒之地</div><p class="hd">三重命途交汇的模拟世界——智识、记忆、毁灭。<br>英雄流淌着金色的神血，踏上了逐火之旅。</p><div class="hq">"明天见，是最伟大的谎言"</div><div class="sh">— 向下探索 —</div></section>

<section class="sec" id="river"><h2 class="st rv">时代之河</h2><div class="river-s-wrap rv" id="riverSWrap"></div></section>

<section class="sec" id="reg"><div class="reg-bg active" id="regBg"></div><div class="reg-bg" id="regBgNext"></div><div class="reg-overlay" id="regOverlay"><div class="rn2" id="regName"></div><div class="rt2" id="regTitle"></div><div class="rdv"></div><div class="rdd2" id="regDesc"></div><div class="rm" id="regMeta"></div></div><div class="reg-dots" id="regDots"></div></section>

<section class="sec" id="tt"><div class="tt-wrap rv" id="ttWrap" style="width:100%"><div id="ttArch" class="tt-arch"></div><div class="tt-gl" id="ttGl"></div></div><div class="tt-focus-tip" id="ttTip"></div><button class="tft-close" id="tftClose" onclick="closeTitanDetail()">&times;</button></section>

<section class="sec" id="bk"><h2 class="st rv" style="margin-bottom:10px">黄金裔</h2><div class="bc rv"><div class="bs" id="sb"><div class="bst">— 如我所书 —</div></div><div class="bcont" id="bcont"><div class="bci" id="bci"></div><div class="bci-right" id="bciRight"></div><div class="cds2" id="cs"></div></div></div></section>

<section class="sec" id="fn"><div class="fs rv"><div class="fq">"于长夜重返大地"</div><p class="ft">翁法罗斯的永劫回归以自身和铁墓一同陨落迎来终结。<br>权杖爆炸使之成为可观测的星体，「记忆」的忆质保留了文明的火种。</p><div class="fsi">愿此行，终抵群星</div><button class="fb" onclick="document.getElementById('h').scrollIntoView({behavior:'smooth'})">再启程</button></div></section>

<script>
//======== DATA ========
const ERAS=[
{icon:'🌌',name:'启蒙世',tag:'泰坦的诞生',desc:'门径之泰坦雅努斯在混沌中最初苏醒，开辟通路，连通城邦。命运三泰坦编织了时间、空间与律法。支柱三泰坦撑起了天空、大地与海洋。'},
{icon:'🏛️',name:'造物世',tag:'生命的塑造',desc:'创生三泰坦捏造了生命，刻法勒创造人类。世界充满了生命的喧响。'},
{icon:'✨',name:'黄金世',tag:'繁荣的时代',desc:'世间既无疾苦，亦无灾祸；石无磨损，人无尽寿。文明的火焰在大地上燃烧，城邦如星点般兴起。'},
{icon:'⚔️',name:'纷争世',tag:'灾厄降临',desc:'灾厄三泰坦降临，黑潮席卷世界。英雄们第一次踏上弑神之旅。'},
{icon:'🌑',name:'幻灭世',tag:'永恒的暗夜',desc:'天空闭上了眼，大地陷入永夜。黄金裔们开始了逐火之旅。'}
];

const REGIONS=[

function ip(){const c=document.getElementById('pc'),ctx=c.getContext('2d');let w,h,ps=[];function rs(){w=c.width=innerWidth;h=c.height=innerHeight};rs();addEventListener('resize',rs);for(let i=80;i--;)ps.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,r:Math.random()*2+.5,a:Math.random()*.5+.2});function dr(){ctx.clearRect(0,0,w,h);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(212,175,55,${p.a*.4})`;ctx.fill()});for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){const d=Math.hypot(ps[i].x-ps[j].x,ps[i].y-ps[j].y);if(d<120){ctx.beginPath();ctx.moveTo(ps[i].x,ps[i].y);ctx.lineTo(ps[j].x,ps[j].y);ctx.strokeStyle=`rgba(212,175,55,${.06*(1-d/120)})`;ctx.lineWidth=.5;ctx.stroke()}}requestAnimationFrame(dr)}dr()}

(function rr(){
  const w=document.getElementById('riverSWrap');
  if(!w)return;
  // Bezier helper: cubic bezier y at t
  function bezY(t,p0,p1,p2,p3){return (1-t)*(1-t)*(1-t)*p0+3*(1-t)*(1-t)*t*p1+3*(1-t)*t*t*p2+t*t*t*p3}
  // Segment 1: (0,150)->(160,30)->(320,270)->(480,150)
  // Segment 2: (480,150)->(640,30)->(800,270)->(960,150)
  // 5 nodes at t values that give good distribution:
  const seg1=[0,0.5,1]; // t for segment 1
  const seg2=[0.3,0.8]; // t for segment 2
  const sides=['up','down','up','down','up'];
  const pcts=['8%','28%','50%','72%','92%'];
  const yOffsets=[];
  // Calculate bezier y for each node (viewBox y: 0-300, center at 150)
  const yVals=[
    bezY(0.16,150,30,270,150), // node 1 on seg1, t≈0.16
    bezY(0.62,150,30,270,150), // node 2 on seg1, t≈0.62
    150,                        // node 3 at junction
    bezY(0.35,150,30,270,150), // node 4 on seg2, t≈0.35
    bezY(0.82,150,30,270,150), // node 5 on seg2, t≈0.82
  ];
  const svg=`<svg class="river-s-svg" viewBox="0 0 960 300" preserveAspectRatio="xMidYMid meet"><path d="M 0 150 C 160 30, 320 270, 480 150 C 640 30, 800 270, 960 150" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.4"/><path d="M 0 150 C 160 30, 320 270, 480 150 C 640 30, 800 270, 960 150" fill="none" stroke="#D4AF37" stroke-width="6" opacity="0.08"/></svg>`;
  let html=svg;
  ERAS.forEach((e,i)=>{
    // Convert viewBox y (0-300) to percentage of container height
    // SVG is 60% height centered, viewBox center y=150 maps to 50% of container
    const yPct=50+(yVals[i]-150)/300*60; // 60% SVG height, centered
    html+=`<div class="river-s-node" data-side="${sides[i]}" style="left:${pcts[i]};top:${yPct}%">
      <div class="river-s-dot"></div>
      <div class="river-s-card">
        <div class="rc-icon">${e.icon}</div>
        <div class="rc-name">${e.name}</div>
        <div class="rc-tag">${e.tag}</div>
        <div class="rc-div"></div>
        <div class="rc-desc">${e.desc}</div>
      </div>
    </div>`;
  });
  w.innerHTML=html;
})();

(function rtt(){
  const arch=document.getElementById('ttArch');
  const n=TITANS.length;
  function positionTitans(){
    const rect=arch.getBoundingClientRect();
    const w=rect.width,h=rect.height;
    if(w<100||h<100)return;
    const R=Math.min(w*0.45,h*0.88);
    const cx=w/2,cy=h-20;
    const iconSize=Math.min(50,Math.max(30,R/7));
    const fSize=Math.max(9,Math.min(14,iconSize/4));
    const sSize=Math.max(8,Math.min(12,iconSize/5));
    let items='';
    TITANS.forEach((t,i)=>{
      const rad=Math.PI*i/(n-1);
      const x=cx+R*Math.cos(rad)-iconSize/2;
      let y=cy-R*Math.sin(rad)-iconSize/2-33;
      if(i===0||i===n-1)y-=20;
      items+=`<div class="tt-item" data-i="${i}" style="left:${x}px;top:${y}px"><img src="images/泰坦/${t.img}" style="width:${iconSize}px;height:${iconSize}px"><div class="tl" style="font-size:${fSize}px">${t.name}</div><div class="ts2" style="font-size:${sSize}px">${t.title}</div></div>`;
    });
    const tSize=Math.min(36,Math.max(24,iconSize*0.55));
    items+=`<div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;z-index:4;pointer-events:none"><div style="font-family:var(--font-display);font-size:${tSize}px;color:var(--gold);letter-spacing:6px;text-shadow:0 0 30px rgba(212,175,55,.3)">✦ 泰坦神座 ✦</div><div style="font-size:${Math.max(12,tSize*0.35)}px;color:var(--text-secondary);letter-spacing:4px;margin-top:2px">创世涡心</div></div>`;
    arch.innerHTML=items;
    arch.querySelectorAll('.tt-item').forEach(c=>c.onclick=()=>openTitan(c.dataset.i));
  }
  positionTitans();
  window.addEventListener('resize',positionTitans);
  document.getElementById('ttGl').innerHTML=['灾厄','支柱','创生','命运'].map(g=>`<span>${g}三泰坦</span>`).join('');
})();

  // Titan center relative to arch
  const ox=(itemR.left+itemR.width/2)-archR.left;
  const oy=(itemR.top+itemR.height/2)-archR.top;
  arch.style.transformOrigin=`${ox}px ${oy}px`;
  // Target: center of left 3/4
  const tx=(window.innerWidth*0.36-(itemR.left+itemR.width/2))/S;
  const ty=(window.innerHeight*0.45-(itemR.top+itemR.height/2))/S;
  arch.style.transform=`scale(${S}) translate(${tx}px,${ty}px)`;
  arch.querySelectorAll('.tt-item').forEach(n=>n.classList.remove('active'));
  item.classList.add('active');
  wrap.classList.add('zoomed');
  // Detail panel
  document.getElementById('ttTip').innerHTML=`<div class="tf-name">${t.name}</div><div class="tf-title">${t.title}</div><div class="tf-div"></div><div class="tf-row"><span class="l">神权</span><span class="v">${t.power}</span></div><div class="tf-row"><span class="l">继承者</span><span class="v">${t.heir}</span></div><div class="tf-row"><span class="l">所属</span><span class="v">${t.group}</span></div><div class="tf-div"></div><div class="tf-row"><span class="v">${t.desc}</span></div>`;
  document.getElementById('ttTip').classList.add('open');
  document.getElementById('tftClose').classList.add('open');
}
function closeTitanDetail(){
  const arch=document.getElementById('ttArch');
  const wrap=document.getElementById('ttWrap');
  arch.style.transform='';
  wrap.classList.remove('zoomed');
  document.getElementById('ttTip').classList.remove('open');
  document.getElementById('tftClose').classList.remove('open');
}
